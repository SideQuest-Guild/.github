name: Idea
description: Suggest something new for the site, the bot, the addon or the companion app.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help with?
      description: Describe the problem or the moment in game where you'd use it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What do you have in mind?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Sketches, screenshots, or how another guild does it.
